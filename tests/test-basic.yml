name: Test basic usage - accelerated mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Python
        run: |
          python --version
          pip --version
      - name: Install Python development headers
        run: |
          # Nuitka needs Python.h to compile C code
          PYVER=$(python --version | awk '{print $2}' | cut -d'.' -f1,2)
          echo "Python version: $PYVER"
          sudo apt-get update -qq
          sudo apt-get install -y "python${PYVER}-dev" || sudo apt-get install -y python3-dev
      - id: action
        uses: .
        with:
          script-name: tests/fixtures/hello.py
          mode: accelerated
          output-dir: build
          nuitka-version: main
          assume-yes-for-downloads: true
          # disable-cache=ccache skips both the ccache apt-get install step
          # (which fails in act) and the actions/cache step
          disable-cache: ccache
          static-libpython: "no"
      - name: Assert build output exists
        run: |
          echo "Checking build directory..."
          ls -la build/ || true
          # In accelerated mode, Nuitka produces a .bin or executable
          # Check that the build directory was created and contains output
          if [ ! -d "build" ]; then
            echo "FAIL: build directory was not created"
            exit 1
          fi
          echo "Build directory contents:"
          find build -type f | head -20
          echo "PASS: build directory exists with output"
