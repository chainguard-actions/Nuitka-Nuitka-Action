name: Test basic Nuitka build

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc python3-dev patchelf

      - name: Create simple Python script
        run: |
          cat > hello.py << 'EOF'
          print("Hello from Nuitka!")
          EOF

      - name: Build with Nuitka
        id: build
        uses: .
        with:
          script-name: hello.py
          nuitka-version: "2.0"
          standalone: "false"
          onefile: "false"
          module: "false"
          output-dir: build
          disable-cache: "true"
          show-scons: "false"
          assume-yes-for-downloads: "true"

      - name: Assert build output exists
        run: |
          echo "Checking for build output..."
          ls -la build/ || true
          if [ ! -d "build" ]; then
            echo "FAIL: output directory build does not exist"
            exit 1
          fi
          echo "PASS: build directory exists"

      - name: Assert executable was created
        run: |
          echo "Checking for hello executable..."
          if find build -name "hello*" -type f | grep -q .; then
            echo "PASS: found hello executable"
            find build -name "hello*" -type f
          else
            echo "FAIL: no hello executable found in build directory"
            find build -type f || true
            exit 1
          fi
