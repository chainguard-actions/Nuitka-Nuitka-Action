name: Test basic Nuitka build (accelerated mode)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gcc \
            python3-dev \
            python3-pip \
            python-is-python3 \
            patchelf \
            git
          python --version
          pip --version

      - name: Create simple Python script
        run: |
          cat > hello.py << 'EOF'
          print("Hello from Nuitka!")
          EOF

      - name: Build with Nuitka (accelerated mode, no cache)
        id: build
        uses: .
        with:
          script-name: hello.py
          nuitka-version: "main"
          mode: accelerated
          disable-cache: "true"
          assume-yes-for-downloads: "true"
          output-dir: build

      - name: Assert build output exists
        run: |
          echo "Checking for build output..."
          echo "=== build/ directory contents ==="
          find build/ -type f 2>/dev/null || echo "build/ directory is empty or missing"
          echo "================================="
          # In accelerated mode on Linux, Nuitka produces hello.bin or hello
          if find build/ -name "hello*" -type f | grep -q .; then
            echo "PASS: Build output found"
            find build/ -name "hello*" -type f
          else
            echo "FAIL: Expected build output not found in build/"
            exit 1
          fi

      - name: Run the compiled binary
        run: |
          binary=$(find build/ -name "hello*" -type f | head -1)
          if [ -z "$binary" ]; then
            echo "SKIP: No binary found to run"
            exit 0
          fi
          echo "Running: $binary"
          chmod +x "$binary"
          output=$("$binary")
          echo "Output: $output"
          if echo "$output" | grep -q "Hello from Nuitka!"; then
            echo "PASS: Binary output matches expected"
          else
            echo "FAIL: Expected 'Hello from Nuitka!' but got: $output"
            exit 1
          fi
