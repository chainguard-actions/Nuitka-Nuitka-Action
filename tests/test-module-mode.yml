name: Test module mode compilation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Python
        run: |
          python --version
          pip --version
      - name: Install Python development headers
        run: |
          # Nuitka needs Python.h to compile C code (module mode requires it too)
          PYVER=$(python --version | awk '{print $2}' | cut -d'.' -f1,2)
          echo "Python version: $PYVER"
          sudo apt-get update -qq
          sudo apt-get install -y "python${PYVER}-dev" || sudo apt-get install -y python3-dev
      - id: action
        uses: .
        with:
          script-name: tests/fixtures/mymodule.py
          mode: module
          output-dir: build-module
          nuitka-version: main
          assume-yes-for-downloads: true
          # disable-cache=ccache skips both the ccache apt-get install step
          # (which fails in act) and the actions/cache step
          disable-cache: ccache
          static-libpython: "no"
      - name: Assert module build output exists
        run: |
          echo "Checking build-module directory..."
          ls -la build-module/ || true
          if [ ! -d "build-module" ]; then
            echo "FAIL: build-module directory was not created"
            exit 1
          fi
          echo "Build module directory contents:"
          find build-module -type f | head -20
          # Check for .so extension module on Linux
          SO_COUNT=$(find build-module -name "*.so" | wc -l)
          echo "Found $SO_COUNT .so files"
          if [ "$SO_COUNT" -lt 1 ]; then
            echo "FAIL: no .so extension module found in build-module"
            exit 1
          fi
          echo "PASS: extension module (.so) was created"
