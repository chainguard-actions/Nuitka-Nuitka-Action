name: Test Nuitka module mode compilation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential python3-dev patchelf ccache

      - name: Create Python module to compile
        run: |
          cat > mymodule.py << 'EOF'
          def greet(name):
              return f"Hello, {name}!"

          def add(a, b):
              return a + b
          EOF

      - id: action
        uses: .
        with:
          script-name: mymodule.py
          mode: module
          output-dir: nuitka-module-build
          disable-cache: "true"
          assume-yes-for-downloads: "true"
          nuitka-version: "main"

      - name: Assert module build output directory exists
        run: |
          echo "Checking module build output directory..."
          if [ ! -d "nuitka-module-build" ]; then
            echo "FAIL: output directory nuitka-module-build does not exist"
            ls -la . || true
            exit 1
          fi
          echo "PASS: output directory exists"
          ls -la nuitka-module-build/ || true

      - name: Assert compiled extension module exists
        run: |
          echo "Checking for compiled extension module (.so file)..."
          if ! find nuitka-module-build -name "mymodule*.so" -type f | grep -q .; then
            echo "FAIL: no compiled .so module found in nuitka-module-build"
            find nuitka-module-build -type f || true
            exit 1
          fi
          echo "PASS: compiled extension module found"
          find nuitka-module-build -name "mymodule*.so" -type f
