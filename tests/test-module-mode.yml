name: Test Nuitka build in module mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gcc \
            python3-dev \
            python3-pip \
            python-is-python3 \
            patchelf \
            git
          python --version
          pip --version

      - name: Create simple Python module
        run: |
          cat > mymodule.py << 'EOF'
          def greet(name):
              return f"Hello, {name}!"

          def add(a, b):
              return a + b
          EOF

      - name: Build with Nuitka (module mode, no cache)
        id: build
        uses: .
        with:
          script-name: mymodule.py
          nuitka-version: "main"
          mode: module
          disable-cache: "true"
          assume-yes-for-downloads: "true"
          output-dir: build

      - name: Assert module build output exists
        run: |
          echo "Checking for module build output..."
          echo "=== build/ directory contents ==="
          find build/ -type f 2>/dev/null || echo "build/ directory is empty or missing"
          echo "================================="
          # In module mode, Nuitka produces a .so (Linux) or .pyd (Windows) file
          if find build/ -name "mymodule*" -type f | grep -q .; then
            echo "PASS: Module build output found"
            find build/ -name "mymodule*" -type f
          else
            echo "FAIL: Expected module output not found in build/"
            exit 1
          fi
