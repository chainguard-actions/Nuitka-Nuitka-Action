name: Test module compilation mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3 python3-pip python3-dev gcc ccache
          # Ensure 'python' and 'pip' commands exist
          if ! command -v python &>/dev/null; then
            sudo ln -sf /usr/bin/python3 /usr/local/bin/python
          fi
          if ! command -v pip &>/dev/null; then
            sudo ln -sf /usr/bin/pip3 /usr/local/bin/pip
          fi
          python --version
          pip --version

      - id: action
        uses: .
        with:
          script-name: tests/fixtures/mymodule.py
          mode: module
          output-dir: tests/fixtures/build-module
          disable-cache: "true"
          assume-yes-for-downloads: "true"

      - name: Assert module build output exists
        run: |
          echo "Checking module build output directory..."
          ls -la tests/fixtures/build-module/ || true
          # Nuitka module mode produces a .so or .pyd extension module
          if ls tests/fixtures/build-module/mymodule*.so 2>/dev/null | grep -q . || \
             ls tests/fixtures/build-module/mymodule*.pyd 2>/dev/null | grep -q . || \
             ls tests/fixtures/build-module/mymodule* 2>/dev/null | grep -q .; then
            echo "PASS: module build output found"
          else
            echo "FAIL: expected module build output not found in tests/fixtures/build-module/"
            ls -la tests/fixtures/build-module/ || echo "(directory empty or missing)"
            exit 1
          fi
