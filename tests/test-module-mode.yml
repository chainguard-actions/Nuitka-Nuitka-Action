name: Test module mode build

on:
  workflow_dispatch:

jobs:
  test-module:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install system dependencies for Nuitka
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc python3-dev patchelf

      - name: Set up Python
        run: |
          python --version
          pip --version

      - id: build
        uses: .
        with:
          working-directory: tests/fixtures
          script-name: mymodule.py
          module: "true"
          standalone: "false"
          onefile: "false"
          output-dir: build
          assume-yes-for-downloads: "true"
          disable-cache: "true"

      - name: Assert extension module was created
        run: |
          echo "Checking for built extension module..."
          ls -la tests/fixtures/build/ || true
          # Extension modules have .so on Linux, .pyd on Windows
          FOUND=$(find tests/fixtures/build -maxdepth 2 \( -name "*.so" -o -name "*.pyd" \) 2>/dev/null | head -1)
          if [ -z "$FOUND" ]; then
            echo "FAIL: No extension module (.so/.pyd) found in tests/fixtures/build directory"
            find tests/fixtures/build -type f 2>/dev/null || echo "build directory does not exist"
            exit 1
          fi
          echo "PASS: Extension module found: $FOUND"
