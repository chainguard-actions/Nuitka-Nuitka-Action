name: Test commercial and advanced plugin options inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create test script
        run: |
          cat > /tmp/hello.py << 'EOF'
          print("hello")
          EOF
      - id: action
        uses: .
        continue-on-error: true
        with:
          script-name: /tmp/hello.py
          mode: accelerated
          access-token: ""
          anti-debugger-debugging: ""
          auto-update-debug: ""
          auto-update-url-spec: ""
          data-hiding-salt-value: ""
          embed-data-files-compile-time-pattern: ""
          embed-data-files-qt-resource-pattern: ""
          embed-data-files-run-time-pattern: ""
          embed-debug-qt-resources: ""
          encryption-key: ""
          encrypt-crypto-package: ""
          encrypt-debug-init: ""
          encrypt-stderr: ""
          encrypt-stdout: ""
          include-pickle-support-module: ""
          include-pmw-blt: ""
          include-pmw-color: ""
          upx-binary: ""
          upx-disable-cache: ""
          output-dir: /tmp/build-commercial
          disable-cache: "true"
      - name: Assert action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
