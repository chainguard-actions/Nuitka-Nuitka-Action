name: Test Nuitka with commercial plugin options (no access token)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gcc \
            python3-dev \
            python3-pip \
            python-is-python3 \
            patchelf \
            git
          python --version
          pip --version

      - name: Create simple Python script
        run: |
          cat > commercial.py << 'EOF'
          print("Commercial options test")
          EOF

      - name: Build with Nuitka (commercial plugin inputs, no actual token)
        id: build
        uses: .
        with:
          script-name: commercial.py
          nuitka-version: "main"
          mode: accelerated
          disable-cache: "true"
          assume-yes-for-downloads: "true"
          output-dir: build
          access-token: ""
          anti-debugger-debugging: "false"
          auto-update-url-spec: ""
          auto-update-debug: "false"
          data-hiding-salt-value: ""
          embed-data-files-compile-time-pattern: ""
          embed-data-files-run-time-pattern: ""
          embed-data-files-qt-resource-pattern: ""
          embed-debug-qt-resources: "false"
          encryption-key: ""
          encrypt-stdout: "false"
          encrypt-stderr: "false"
          encrypt-debug-init: "false"
          encrypt-crypto-package: ""
          windows-service-name: ""
          windows-service-grace-time: ""
          windows-service-start-mode: ""
          windows-service-cli: "false"
          windows-signing-tool: ""
          windows-certificate-name: ""
          windows-certificate-sha1: ""
          windows-certificate-filename: ""
          windows-certificate-password: ""
          windows-signed-content-comment: ""

      - name: Assert build output exists
        run: |
          echo "Checking for build output..."
          find build/ -type f 2>/dev/null || echo "build/ directory is empty or missing"
          if find build/ -name "commercial*" -type f | grep -q .; then
            echo "PASS: Build output found"
          else
            echo "FAIL: Expected build output not found in build/"
            exit 1
          fi
