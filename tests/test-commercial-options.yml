name: Test commercial and encryption inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3 python3-pip python3-dev gcc ccache
          if ! command -v python &>/dev/null; then
            sudo ln -sf /usr/bin/python3 /usr/local/bin/python
          fi
          if ! command -v pip &>/dev/null; then
            sudo ln -sf /usr/bin/pip3 /usr/local/bin/pip
          fi
          python --version
          pip --version

      - id: action
        uses: .
        with:
          script-name: tests/fixtures/hello.py
          mode: accelerated
          output-dir: tests/fixtures/build-commercial
          disable-cache: "true"
          assume-yes-for-downloads: "true"
          access-token: ""
          anti-debugger-debugging: "false"
          auto-update-debug: "false"
          auto-update-url-spec: ""
          data-hiding-salt-value: ""
          embed-data-files-compile-time-pattern: ""
          embed-data-files-run-time-pattern: ""
          embed-data-files-qt-resource-pattern: ""
          embed-debug-qt-resources: "false"
          encrypt-crypto-package: ""
          encrypt-debug-init: "false"
          encrypt-stderr: "false"
          encrypt-stdout: "false"
          encryption-key: ""

      - name: Assert build succeeded
        run: |
          echo "Checking build output..."
          if ls tests/fixtures/build-commercial/hello* 2>/dev/null | grep -q .; then
            echo "PASS: build output found"
          else
            echo "FAIL: expected build output not found"
            ls -la tests/fixtures/build-commercial/ || echo "(directory empty or missing)"
            exit 1
          fi
