name: Test Nuitka commercial and advanced plugin options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential python3-dev patchelf ccache

      - name: Create simple Python script to compile
        run: |
          cat > hello_commercial.py << 'EOF'
          print("Hello from Nuitka with commercial options!")
          EOF

      - id: action
        uses: .
        with:
          script-name: hello_commercial.py
          mode: accelerated
          output-dir: nuitka-build-commercial
          disable-cache: "true"
          assume-yes-for-downloads: "true"
          nuitka-version: "main"
          access-token: ""
          anti-debugger-debugging: "false"
          auto-update-url-spec: ""
          auto-update-debug: "false"
          data-hiding-salt-value: ""
          embed-data-files-compile-time-pattern: ""
          embed-data-files-run-time-pattern: ""
          embed-data-files-qt-resource-pattern: ""
          embed-debug-qt-resources: "false"
          encryption-key: ""
          encrypt-stdout: "false"
          encrypt-stderr: "false"
          encrypt-debug-init: "false"
          encrypt-crypto-package: ""

      - name: Assert build output directory exists
        run: |
          echo "Checking build output directory..."
          if [ ! -d "nuitka-build-commercial" ]; then
            echo "FAIL: output directory nuitka-build-commercial does not exist"
            ls -la . || true
            exit 1
          fi
          echo "PASS: output directory exists"
          ls -la nuitka-build-commercial/ || true
