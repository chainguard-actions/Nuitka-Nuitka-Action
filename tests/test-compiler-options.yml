name: Test Nuitka compiler and version info options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gcc \
            clang \
            python3-dev \
            python3-pip \
            python-is-python3 \
            patchelf \
            git
          python --version
          pip --version

      - name: Create simple Python script
        run: |
          cat > hello.py << 'EOF'
          print("Hello compiler options!")
          EOF

      - name: Build with Nuitka (compiler and version info options)
        id: build
        uses: .
        with:
          script-name: hello.py
          nuitka-version: "main"
          mode: accelerated
          disable-cache: "true"
          assume-yes-for-downloads: "true"
          output-dir: build
          # Compiler options
          clang: "true"
          jobs: "1"
          lto: "no"
          static-libpython: "no"
          cf-protection: "none"
          # Version information
          company-name: "TestCompany"
          product-name: "TestProduct"
          file-version: "1.0.0.0"
          product-version: "1.0.0.0"
          file-description: "Test binary"
          copyright: "Copyright 2024"
          trademarks: "TestTrademark"
          # Debug options
          debug: "false"
          no-debug-immortal-assumptions: "false"
          no-debug-c-warnings: "false"
          unstripped: "false"
          trace-execution: "false"
          low-memory: "true"
          # Deployment
          deployment: "false"
          no-deployment-flag: ""
          # Misc
          nowarn-mnemonic: ""
          experimental: ""
          xml: ""

      - name: Assert build output exists
        run: |
          echo "Checking for build output..."
          find build/ -type f 2>/dev/null || echo "build/ directory is empty or missing"
          if find build/ -name "hello*" -type f | grep -q .; then
            echo "PASS: Build output found"
          else
            echo "FAIL: Expected build output not found in build/"
            exit 1
          fi
