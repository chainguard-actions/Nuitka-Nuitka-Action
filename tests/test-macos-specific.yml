name: Test macOS-specific inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          script-name: tests/fixtures/hello.py
          disable-cache: "true"
          # macOS app bundle inputs
          macos-app-console-mode: ""
          macos-target-arch: ""
          macos-app-icon: ""
          macos-signed-app-name: ""
          macos-app-name: ""
          macos-app-mode: ""
          macos-prohibit-multiple-instances: "false"
          macos-sign-identity: ""
          macos-sign-notarization: "false"
          macos-app-version: ""
          macos-app-macos-min-version: ""
          macos-app-category-type: ""
          macos-app-protected-resource: ""
          macos-sign-keyring-filename: ""
          macos-sign-keyring-password: ""
          # macOS installer inputs
          macos-create-installer: "false"
          macos-installer-output: ""
      - name: Assert action ran (build attempted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
