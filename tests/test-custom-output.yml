name: Test custom output directory and version info
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3 python3-pip python3-dev gcc ccache
          # Ensure 'python' and 'pip' commands exist
          if ! command -v python &>/dev/null; then
            sudo ln -sf /usr/bin/python3 /usr/local/bin/python
          fi
          if ! command -v pip &>/dev/null; then
            sudo ln -sf /usr/bin/pip3 /usr/local/bin/pip
          fi
          python --version
          pip --version

      - id: action
        uses: .
        with:
          script-name: tests/fixtures/hello.py
          mode: accelerated
          output-dir: tests/fixtures/build-custom
          company-name: "TestCompany"
          product-name: "TestProduct"
          file-version: "1.0.0.0"
          product-version: "1.0.0.0"
          disable-cache: "true"
          assume-yes-for-downloads: "true"

      - name: Assert custom build output exists
        run: |
          echo "Checking custom build output directory..."
          ls -la tests/fixtures/build-custom/ || true
          # Nuitka accelerated mode produces a binary named after the script
          if ls tests/fixtures/build-custom/hello* 2>/dev/null | grep -q .; then
            echo "PASS: custom build output found"
          else
            echo "FAIL: expected build output not found in tests/fixtures/build-custom/"
            ls -la tests/fixtures/build-custom/ || echo "(directory empty or missing)"
            exit 1
          fi
