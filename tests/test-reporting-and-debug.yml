name: Test reporting, tracing, and debug inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          script-name: tests/fixtures/hello.py
          disable-cache: "true"
          # Reporting inputs
          report: ""
          report-diffable: "false"
          report-user-provided: ""
          report-template: ""
          quiet: "false"
          show-scons: "false"
          show-memory: "false"
          # Debug inputs
          debug: "false"
          debug-self-forking: "false"
          debug-address-sanitizer: "false"
          no-debug-immortal-assumptions: "false"
          no-debug-c-warnings: "false"
          unstripped: "false"
          trace-execution: "false"
          xml: ""
          experimental: ""
          # Warning inputs
          warn-implicit-exceptions: "false"
          warn-unusual-code: "false"
          nowarn-mnemonic: ""
          # Deployment inputs
          deployment: "false"
          no-deployment-flag: ""
          # Environment control
          force-runtime-environment-variable: ""
          force-stdout-spec: ""
          force-stderr-spec: ""
      - name: Assert action ran (build attempted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
