name: Test Nuitka build with custom output filename
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gcc \
            python3-dev \
            python3-pip \
            python-is-python3 \
            patchelf \
            git
          python --version
          pip --version

      - name: Create simple Python script
        run: |
          cat > compute.py << 'EOF'
          result = 6 * 7
          print(f"The answer is {result}")
          EOF

      - name: Build with Nuitka using custom output filename (no cache)
        id: build
        uses: .
        with:
          script-name: compute.py
          nuitka-version: "main"
          mode: accelerated
          disable-cache: "true"
          assume-yes-for-downloads: "true"
          output-dir: dist
          output-file: my_compute

      - name: Assert custom-named build output exists
        run: |
          echo "Checking for custom-named build output..."
          echo "=== dist/ directory contents ==="
          find dist/ -type f 2>/dev/null || echo "dist/ directory is empty or missing"
          echo "================================="
          # Output should be named my_compute (or my_compute.bin on Linux)
          if find dist/ -name "my_compute*" -type f | grep -q .; then
            echo "PASS: Custom-named build output found"
            find dist/ -name "my_compute*" -type f
          else
            echo "FAIL: Expected custom-named output 'my_compute' not found in dist/"
            exit 1
          fi
