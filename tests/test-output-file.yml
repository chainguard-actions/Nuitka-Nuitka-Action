name: Test build with custom output filename

on:
  workflow_dispatch:

jobs:
  test-output-file:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install system dependencies for Nuitka
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc python3-dev patchelf

      - name: Set up Python
        run: |
          python --version
          pip --version

      - id: build
        uses: .
        with:
          working-directory: tests/fixtures
          script-name: hello.py
          standalone: "true"
          onefile: "true"
          output-dir: build
          output-file: my_custom_binary
          assume-yes-for-downloads: "true"
          disable-cache: "true"

      - name: Assert binary was created with custom name
        run: |
          echo "Checking for custom-named binary..."
          ls -la tests/fixtures/build/ || true
          if [ ! -f "tests/fixtures/build/my_custom_binary" ] && [ ! -f "tests/fixtures/build/my_custom_binary.exe" ]; then
            echo "FAIL: Custom binary 'my_custom_binary' not found in tests/fixtures/build directory"
            ls -la tests/fixtures/build/ 2>/dev/null || echo "build directory does not exist"
            exit 1
          fi
          echo "PASS: Custom-named binary found"

      - name: Run the custom-named binary
        run: |
          if [ -f "tests/fixtures/build/my_custom_binary" ]; then
            BINARY="tests/fixtures/build/my_custom_binary"
          elif [ -f "tests/fixtures/build/my_custom_binary.exe" ]; then
            BINARY="tests/fixtures/build/my_custom_binary.exe"
          else
            echo "FAIL: No custom binary to run"
            exit 1
          fi
          echo "Running: $BINARY"
          OUTPUT=$("$BINARY")
          echo "Output: $OUTPUT"
          if [ "$OUTPUT" != "Hello from Nuitka!" ]; then
            echo "FAIL: Expected 'Hello from Nuitka!' but got '$OUTPUT'"
            exit 1
          fi
          echo "PASS: Custom-named binary runs correctly"
