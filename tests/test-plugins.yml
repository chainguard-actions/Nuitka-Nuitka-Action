name: Test plugin-related inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          script-name: tests/fixtures/hello.py
          disable-cache: "true"
          # Plugin inputs
          enable-plugins: ""
          disable-plugins: ""
          user-plugin: ""
          plugin-no-detection: "false"
          module-parameter: ""
          # Qt plugin inputs
          include-qt-plugins: ""
          noinclude-qt-plugins: ""
          noinclude-qt-translations: "false"
          qt-debug-plugins: "false"
          # Tk/Tcl inputs
          tk-library-dir: ""
          tcl-library-dir: ""
          # Torch hub
          torch-hub-model: ""
          # PMW inputs
          include-pmw-blt: ""
          include-pmw-color: ""
          # Dill compat
          include-pickle-support-module: ""
          # UPX inputs
          upx-binary: ""
          upx-disable-cache: "false"
      - name: Assert action ran (build attempted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
