name: Test Nuitka plugin and anti-bloat options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gcc \
            python3-dev \
            python3-pip \
            python-is-python3 \
            patchelf \
            git
          python --version
          pip --version

      - name: Create simple Python script
        run: |
          cat > hello.py << 'EOF'
          print("Hello plugins!")
          EOF

      - name: Build with Nuitka (plugin and anti-bloat options)
        id: build
        uses: .
        with:
          script-name: hello.py
          nuitka-version: "main"
          mode: accelerated
          disable-cache: "true"
          assume-yes-for-downloads: "true"
          output-dir: build
          enable-plugins: ""
          user-plugin: ""
          plugin-no-detection: ""
          module-parameter: ""
          noinclude-setuptools-mode: "warning"
          noinclude-pytest-mode: "warning"
          noinclude-unittest-mode: "warning"
          noinclude-pydoc-mode: "warning"
          noinclude-IPython-mode: "warning"
          noinclude-dask-mode: "warning"
          noinclude-numba-mode: "warning"
          noinclude-default-mode: "warning"
          noinclude-custom-mode: ""

      - name: Assert build output exists
        run: |
          echo "Checking for build output..."
          find build/ -type f 2>/dev/null || echo "build/ directory is empty or missing"
          if find build/ -name "hello*" -type f | grep -q .; then
            echo "PASS: Build output found"
            find build/ -name "hello*" -type f
          else
            echo "FAIL: Expected build output not found in build/"
            exit 1
          fi
