name: Test plugin options inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create dummy script
        run: echo "print('hello')" > hello.py
      - id: action
        uses: .
        continue-on-error: true
        with:
          script-name: hello.py
          mode: accelerated
          enable-plugins: ""
          user-plugin: ""
          plugin-no-detection: "false"
          module-parameter: ""
          noinclude-setuptools-mode: "warning"
          noinclude-pytest-mode: "warning"
          noinclude-unittest-mode: "warning"
          noinclude-pydoc-mode: "warning"
          noinclude-IPython-mode: "warning"
          noinclude-dask-mode: "warning"
          noinclude-numba-mode: "warning"
          noinclude-default-mode: "warning"
          noinclude-custom-mode: ""
          nowarn-mnemonic: ""
          warn-implicit-exceptions: "false"
          warn-unusual-code: "false"
          disable-cache: "true"
      - name: Assert action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
