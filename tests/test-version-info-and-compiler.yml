name: Test version info, compiler, and output inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          script-name: tests/fixtures/hello.py
          disable-cache: "true"
          # Version information inputs
          company-name: "TestCorp"
          product-name: "TestProduct"
          file-version: "1.0.0.0"
          product-version: "1.0.0"
          file-description: "Test binary"
          copyright: "Copyright 2024 TestCorp"
          trademarks: "TestCorp TM"
          # Output inputs
          output-file: "hello_out"
          # Compiler inputs
          clang: "false"
          mingw64: "false"
          zig: "false"
          msvc: ""
          jobs: "1"
          lto: "no"
          reproducible: "yes"
          static-libpython: "auto"
          cf-protection: "none"
          target-arch: ""
          # General build inputs
          python-flag: "no_site"
          python-debug: "false"
          low-memory: "true"
          update-check: "never"
      - name: Assert action ran (build attempted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
