name: Test Nuitka with version info, compiler, and debug options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gcc \
            python3-dev \
            python3-pip \
            python-is-python3 \
            patchelf \
            git
          python --version
          pip --version

      - name: Create simple Python script
        run: |
          cat > versioned.py << 'EOF'
          print("Versioned app")
          EOF

      - name: Build with Nuitka (version info, compiler, debug options)
        id: build
        uses: .
        with:
          script-name: versioned.py
          nuitka-version: "main"
          mode: accelerated
          disable-cache: "true"
          assume-yes-for-downloads: "true"
          output-dir: build
          company-name: "TestCorp"
          product-name: "TestProduct"
          file-version: "1.0.0.0"
          product-version: "1.0.0.0"
          file-description: "Test binary"
          copyright: "Copyright 2024 TestCorp"
          trademarks: "TestCorp TM"
          clang: "false"
          mingw64: "false"
          msvc: ""
          jobs: "1"
          lto: "auto"
          static-libpython: "auto"
          cf-protection: "auto"
          debug: "false"
          no-debug-immortal-assumptions: "false"
          no-debug-c-warnings: "false"
          unstripped: "false"
          trace-execution: "false"
          xml: ""
          experimental: ""
          low-memory: "false"
          python-flag: ""
          python-debug: "false"
          quiet: "false"
          show-scons: "false"
          show-memory: "false"
          warn-implicit-exceptions: "false"
          warn-unusual-code: "false"
          nowarn-mnemonic: ""
          deployment: "false"
          no-deployment-flag: ""

      - name: Assert build output exists
        run: |
          echo "Checking for build output..."
          find build/ -type f 2>/dev/null || echo "build/ directory is empty or missing"
          if find build/ -name "versioned*" -type f | grep -q .; then
            echo "PASS: Build output found"
          else
            echo "FAIL: Expected build output not found in build/"
            exit 1
          fi
