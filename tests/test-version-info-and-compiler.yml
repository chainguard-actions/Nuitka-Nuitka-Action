name: Test Nuitka version info and compiler options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential python3-dev patchelf ccache

      - name: Create simple Python script to compile
        run: |
          cat > hello_version.py << 'EOF'
          print("Hello from Nuitka with version info!")
          EOF

      - id: action
        uses: .
        with:
          script-name: hello_version.py
          mode: accelerated
          output-dir: nuitka-build-version
          output-file: hello_version_out
          disable-cache: "true"
          assume-yes-for-downloads: "true"
          nuitka-version: "main"
          company-name: "TestCompany"
          product-name: "TestProduct"
          file-version: "1.0.0.0"
          product-version: "1.0.0.0"
          file-description: "Test binary description"
          copyright: "Copyright 2024 TestCompany"
          trademarks: "TestTrademark"
          clang: "false"
          mingw64: "false"
          msvc: ""
          jobs: "1"
          lto: "auto"
          static-libpython: "auto"
          cf-protection: "auto"
          low-memory: "true"
          disable-console: "false"
          enable-console: "false"
          windows-console-mode: "force"
          force-stdout-spec: ""
          force-stderr-spec: ""

      - name: Assert build output directory exists
        run: |
          echo "Checking build output directory..."
          if [ ! -d "nuitka-build-version" ]; then
            echo "FAIL: output directory nuitka-build-version does not exist"
            ls -la . || true
            exit 1
          fi
          echo "PASS: output directory exists"
          ls -la nuitka-build-version/ || true
