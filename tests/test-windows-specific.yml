name: Test Windows-specific inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          script-name: tests/fixtures/hello.py
          disable-cache: "true"
          # Windows icon inputs
          windows-icon-from-ico: ""
          windows-icon-from-exe: ""
          # Windows UAC inputs
          windows-uac-admin: "false"
          windows-uac-uiaccess: "false"
          # Windows installer inputs
          windows-create-installer: ""
          windows-nsis-path: ""
          windows-installer-output: ""
          windows-installer-install-dir: ""
          windows-installer-shortcuts: ""
          windows-installer-license-file: ""
          windows-installer-no-user-change-install-dir: "false"
          windows-installer-mode: ""
          # Windows signing inputs (signtool)
          windows-sign-deep: "false"
          windows-disable-signing-cache: "false"
          windows-signing-tool-path: ""
          windows-certificate-name: ""
          windows-certificate-sha1: ""
          windows-certificate-filename: ""
          windows-certificate-password: ""
          windows-signed-content-comment: ""
          # Windows service inputs
          windows-service-name: ""
          windows-service-grace-time: ""
          windows-service-start-mode: ""
          windows-service-cli: "false"
      - name: Assert action ran (build attempted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
