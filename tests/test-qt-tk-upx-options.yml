name: Test Qt, Tk, UPX and package plugin options inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create dummy script
        run: echo "print('hello')" > hello.py
      - id: action
        uses: .
        continue-on-error: true
        with:
          script-name: hello.py
          mode: accelerated
          include-qt-plugins: ""
          noinclude-qt-plugins: ""
          noinclude-qt-translations: "false"
          tk-library-dir: ""
          tcl-library-dir: ""
          include-pickle-support-module: ""
          include-pmw-blt: ""
          include-pmw-color: ""
          upx-binary: ""
          upx-disable-cache: "false"
          disable-cache: "true"
      - name: Assert action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
