name: Test Nuitka onefile, deployment, console, and OS-specific inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gcc \
            python3-dev \
            python3-pip \
            python-is-python3 \
            patchelf \
            git
          python --version
          pip --version

      - name: Create simple Python script
        run: |
          cat > hello.py << 'EOF'
          print("Hello from Nuitka!")
          EOF

      - name: Build with Nuitka (onefile/deployment/console/OS inputs)
        id: build
        continue-on-error: true
        uses: .
        with:
          script-name: hello.py
          nuitka-version: "main"
          mode: accelerated
          disable-cache: "true"
          assume-yes-for-downloads: "true"
          output-dir: build
          # Onefile behavior
          onefile-tempdir-spec: ""
          onefile-child-grace-time: ""
          onefile-no-compression: "false"
          # Deployment modes
          deployment: "false"
          no-deployment-flag: ""
          # Console handling (obsolete but still inputs)
          disable-console: "false"
          enable-console: "false"
          # General OS controls
          force-stdout-spec: ""
          force-stderr-spec: ""
          # Windows specific (no-op on Linux)
          windows-console-mode: ""
          windows-icon-from-ico: ""
          windows-icon-from-exe: ""
          onefile-windows-splash-screen-image: ""
          windows-uac-admin: "false"
          windows-uac-uiaccess: "false"
          # macOS specific (no-op on Linux)
          macos-target-arch: ""
          macos-app-icon: ""
          macos-signed-app-name: ""
          macos-app-name: ""
          macos-app-mode: ""
          macos-sign-identity: ""
          macos-sign-notarization: "false"
          macos-app-version: ""
          macos-app-protected-resource: ""
          # Linux specific
          linux-icon: ""
          # Qt plugin options (no-op without Qt)
          include-qt-plugins: ""
          noinclude-qt-plugins: ""
          noinclude-qt-translations: "false"
          # Tk/Tcl plugin options
          tk-library-dir: ""
          tcl-library-dir: ""
          # Pmw plugin options
          include-pmw-blt: "true"
          include-pmw-color: "true"
          # Dill-compat plugin options
          include-pickle-support-module: ""
          # UPX plugin options
          upx-binary: ""
          upx-disable-cache: "false"

      - name: Assert build ran (or failed gracefully)
        run: |
          echo "Build outcome: ${{ steps.build.outcome }}"
          if [ "${{ steps.build.outcome }}" = "success" ]; then
            if find build/ -name "hello*" -type f | grep -q .; then
              echo "PASS: Build output found"
            else
              echo "FAIL: Build succeeded but no output found"
              exit 1
            fi
          elif [ "${{ steps.build.outcome }}" = "failure" ]; then
            echo "PASS: Action ran and failed gracefully (expected for some input combinations on Linux)"
          else
            echo "FAIL: Unexpected outcome: ${{ steps.build.outcome }}"
            exit 1
          fi
