name: Test Linux-specific and commercial plugin inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          script-name: tests/fixtures/hello.py
          disable-cache: "true"
          # Linux-specific inputs
          linux-app-icon: ""
          linux-app-console-mode: ""
          linux-app-license: ""
          linux-create-installer: ""
          linux-installer-appimagetool-path: ""
          linux-installer-output: ""
          # Commercial: access token (no real token in test)
          access-token: ""
          # Commercial: auto-update plugin inputs
          auto-update-url-spec: ""
          auto-update-debug: "false"
          auto-update-toml-file: ""
          # Commercial: anti-debugger plugin inputs
          anti-debugger-debugging: "false"
          # Commercial: codemeter plugin inputs
          codemeter-path: ""
          codemeter-command: ""
          codemeter-args: ""
          codemeter-keep-unprotected: "false"
          # Commercial: data-hiding plugin inputs
          data-hiding-salt-value: ""
          # Commercial: datafile-inclusion-ng plugin inputs
          embed-data-files-compile-time-pattern: ""
          embed-data-files-run-time-pattern: ""
          embed-data-files-qt-resource-pattern: ""
          embed-debug-qt-resources: "false"
          # Commercial: dll-embedding plugin inputs
          embed-dll-pattern: ""
          # Commercial: traceback-encryption plugin inputs
          encryption-key: ""
          encrypt-stdout: "false"
          encrypt-stderr: "false"
          encrypt-debug-init: "false"
          obfuscate-line-numbers: ""
          private-import-patterns: ""
          # Commercial: esigner plugin inputs
          esigner-sign-deep: "false"
          esigner-disable-signing-cache: "false"
          esigner-tool-path: ""
          esigner-username: ""
          esigner-password: ""
          esigner-credential-id: ""
          esigner-totp-secret: ""
          # Source inclusion plugin inputs
          source-inclusion-args: ""
          source-inclusion-timeout: ""
          show-source-inclusion-trace: "false"
      - name: Assert action ran (build attempted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
