name: Test Nuitka reporting options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gcc \
            python3-dev \
            python3-pip \
            python-is-python3 \
            patchelf \
            git
          python --version
          pip --version

      - name: Create simple Python script
        run: |
          cat > hello.py << 'EOF'
          print("Hello reporting!")
          EOF

      - name: Build with Nuitka (reporting options)
        id: build
        uses: .
        with:
          script-name: hello.py
          nuitka-version: "main"
          mode: accelerated
          disable-cache: "true"
          assume-yes-for-downloads: "true"
          output-dir: build
          report: "build/compilation-report.xml"
          report-diffable: "true"
          report-user-provided: "test-key=test-value"
          report-template: ""
          show-scons: "true"
          show-memory: "true"
          quiet: ""

      - name: Assert build output and report exist
        run: |
          echo "Checking for build output..."
          find build/ -type f 2>/dev/null || echo "build/ directory is empty or missing"
          if find build/ -name "hello*" -type f | grep -q .; then
            echo "PASS: Build output found"
          else
            echo "FAIL: Expected build output not found in build/"
            exit 1
          fi
          if [ -f "build/compilation-report.xml" ]; then
            echo "PASS: Compilation report found"
          else
            echo "INFO: Compilation report not found (may not be supported in this version)"
          fi
