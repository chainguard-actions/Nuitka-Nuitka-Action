name: Test disable-cache option
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3 python3-pip python3-dev gcc ccache
          # Ensure 'python' and 'pip' commands exist
          if ! command -v python &>/dev/null; then
            sudo ln -sf /usr/bin/python3 /usr/local/bin/python
          fi
          if ! command -v pip &>/dev/null; then
            sudo ln -sf /usr/bin/pip3 /usr/local/bin/pip
          fi
          python --version
          pip --version

      - id: action
        uses: .
        with:
          script-name: tests/fixtures/hello.py
          mode: accelerated
          output-dir: tests/fixtures/build-nocache
          disable-cache: "true"
          assume-yes-for-downloads: "true"

      - name: Assert build output exists without cache
        run: |
          echo "Checking build output directory (no cache)..."
          ls -la tests/fixtures/build-nocache/ || true
          # Nuitka accelerated mode produces a binary named after the script
          if ls tests/fixtures/build-nocache/hello* 2>/dev/null | grep -q .; then
            echo "PASS: build output found without cache"
          else
            echo "FAIL: expected build output not found in tests/fixtures/build-nocache/"
            ls -la tests/fixtures/build-nocache/ || echo "(directory empty or missing)"
            exit 1
          fi

      - name: Assert NUITKA_CACHE_DIR is not set when cache disabled
        run: |
          echo "NUITKA_CACHE_DIR=${NUITKA_CACHE_DIR:-<not set>}"
          if [ -z "${NUITKA_CACHE_DIR}" ]; then
            echo "PASS: NUITKA_CACHE_DIR is not set when cache is disabled"
          else
            echo "FAIL: NUITKA_CACHE_DIR should not be set when disable-cache is true"
            exit 1
          fi
