name: Test Nuitka with working-directory input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential python3-dev patchelf ccache

      - name: Create project directory with Python script
        run: |
          mkdir -p myapp
          cat > myapp/app.py << 'EOF'
          import sys
          print(f"Python version: {sys.version}")
          print("App running successfully!")
          EOF

      - id: action
        uses: .
        with:
          script-name: app.py
          working-directory: myapp
          mode: accelerated
          output-dir: build
          disable-cache: "true"
          assume-yes-for-downloads: "true"
          nuitka-version: "main"

      - name: Assert build output directory exists
        run: |
          echo "Checking build output directory..."
          if [ ! -d "myapp/build" ]; then
            echo "FAIL: output directory myapp/build does not exist"
            ls -la myapp/ || true
            exit 1
          fi
          echo "PASS: output directory exists"
          ls -la myapp/build/ || true

      - name: Assert compiled binary exists in working directory build
        run: |
          echo "Checking for compiled binary..."
          if ! find myapp/build -name "app*" -type f | grep -q .; then
            echo "FAIL: no compiled binary found in myapp/build"
            find myapp/build -type f || true
            exit 1
          fi
          echo "PASS: compiled binary found"
          find myapp/build -name "app*" -type f
