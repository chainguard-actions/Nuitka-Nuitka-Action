name: Test Nuitka with working directory

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc python3-dev patchelf

      - name: Create working directory and Python script
        run: |
          mkdir -p myproject
          cat > myproject/app.py << 'EOF'
          import sys
          print(f"Python {sys.version}")
          print("Build successful!")
          EOF

      - name: Build with Nuitka using working directory
        id: build
        uses: .
        with:
          working-directory: myproject
          script-name: app.py
          nuitka-version: "2.0"
          standalone: "false"
          onefile: "false"
          module: "false"
          output-dir: dist
          disable-cache: "true"
          show-scons: "false"
          assume-yes-for-downloads: "true"

      - name: Assert build output exists in working directory
        run: |
          echo "Checking for build output in myproject/dist..."
          ls -la myproject/dist/ || true
          if [ ! -d "myproject/dist" ]; then
            echo "FAIL: output directory myproject/dist does not exist"
            exit 1
          fi
          echo "PASS: build directory exists"

      - name: Assert app executable was created
        run: |
          echo "Checking for app executable..."
          if find myproject/dist -name "app*" -type f | grep -q .; then
            echo "PASS: found app executable"
            find myproject/dist -name "app*" -type f
          else
            echo "FAIL: no app executable found in dist directory"
            find myproject/dist -type f || true
            exit 1
          fi
