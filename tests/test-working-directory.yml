name: Test Nuitka build with working-directory input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gcc \
            python3-dev \
            python3-pip \
            python-is-python3 \
            patchelf \
            git
          python --version
          pip --version

      - name: Create project subdirectory with Python script
        run: |
          mkdir -p myproject
          cat > myproject/app.py << 'EOF'
          import sys
          print(f"Python {sys.version_info.major}.{sys.version_info.minor} app running!")
          EOF

      - name: Build with Nuitka from working directory (no cache)
        id: build
        uses: .
        with:
          script-name: app.py
          nuitka-version: "main"
          working-directory: myproject
          mode: accelerated
          disable-cache: "true"
          assume-yes-for-downloads: "true"
          output-dir: build

      - name: Assert build output exists in working directory
        run: |
          echo "Checking for build output in myproject/build/..."
          echo "=== myproject/build/ directory contents ==="
          find myproject/build/ -type f 2>/dev/null || echo "myproject/build/ directory is empty or missing"
          echo "==========================================="
          # In accelerated mode, Nuitka produces app.bin or app
          if find myproject/build/ -name "app*" -type f | grep -q .; then
            echo "PASS: Build output found in working directory"
            find myproject/build/ -name "app*" -type f
          else
            echo "FAIL: Expected build output not found in myproject/build/"
            exit 1
          fi
