name: Test Windows-specific inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create dummy script
        run: echo "print('hello')" > hello.py
      - id: action
        uses: .
        continue-on-error: true
        with:
          script-name: hello.py
          mode: accelerated
          windows-icon-from-ico: ""
          windows-icon-from-exe: ""
          windows-uac-admin: "false"
          windows-uac-uiaccess: "false"
          windows-certificate-filename: ""
          windows-certificate-name: ""
          windows-certificate-password: ""
          windows-certificate-sha1: ""
          windows-signing-tool: ""
          windows-signed-content-comment: ""
          windows-service-name: ""
          windows-service-grace-time: ""
          windows-service-start-mode: ""
          windows-service-cli: ""
          disable-cache: "true"
      - name: Assert action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
