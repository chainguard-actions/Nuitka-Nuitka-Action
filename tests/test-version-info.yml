name: Test build with version information

on:
  workflow_dispatch:

jobs:
  test-version-info:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install system dependencies for Nuitka
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc python3-dev patchelf

      - name: Set up Python
        run: |
          python --version
          pip --version

      - id: build
        uses: .
        with:
          working-directory: tests/fixtures
          script-name: hello.py
          standalone: "true"
          onefile: "true"
          output-dir: build
          assume-yes-for-downloads: "true"
          disable-cache: "true"
          company-name: "TestCompany"
          product-name: "TestProduct"
          file-version: "1.0.0.0"
          product-version: "1.0.0.0"
          file-description: "Test build with version info"
          copyright: "Copyright 2024 TestCompany"

      - name: Assert binary was created with version info
        run: |
          echo "Checking for built binary..."
          ls -la tests/fixtures/build/ || true
          FOUND=$(find tests/fixtures/build -maxdepth 1 -type f -executable 2>/dev/null | head -1)
          if [ -z "$FOUND" ]; then
            FOUND=$(find tests/fixtures/build -maxdepth 1 -type f 2>/dev/null | grep -v '\.py$' | head -1)
          fi
          if [ -z "$FOUND" ]; then
            echo "FAIL: No executable found in tests/fixtures/build directory"
            find tests/fixtures/build -type f 2>/dev/null || echo "build directory does not exist"
            exit 1
          fi
          echo "PASS: Binary found: $FOUND"

      - name: Run the compiled binary
        run: |
          BINARY=$(find tests/fixtures/build -maxdepth 1 -type f -executable 2>/dev/null | head -1)
          if [ -z "$BINARY" ]; then
            BINARY=$(find tests/fixtures/build -maxdepth 1 -type f 2>/dev/null | grep -v '\.py$' | head -1)
          fi
          if [ -z "$BINARY" ]; then
            echo "FAIL: No executable to run"
            exit 1
          fi
          echo "Running: $BINARY"
          OUTPUT=$("$BINARY")
          echo "Output: $OUTPUT"
          if [ "$OUTPUT" != "Hello from Nuitka!" ]; then
            echo "FAIL: Expected 'Hello from Nuitka!' but got '$OUTPUT'"
            exit 1
          fi
          echo "PASS: Binary with version info runs correctly"
