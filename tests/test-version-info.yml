name: Test Nuitka version information inputs

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc python3-dev patchelf

      - name: Create simple Python script
        run: |
          cat > hello_version.py << 'EOF'
          print("Hello with version info!")
          EOF

      - name: Build with Nuitka using version information inputs
        id: build
        uses: .
        with:
          script-name: hello_version.py
          nuitka-version: "2.0"
          standalone: "false"
          onefile: "false"
          module: "false"
          output-dir: build
          output-file: hello_version
          disable-cache: "true"
          show-scons: "false"
          assume-yes-for-downloads: "true"
          company-name: "Test Company"
          product-name: "Test Product"
          file-version: "1.0.0.0"
          product-version: "1.0.0.0"
          file-description: "A test executable"
          copyright: "Copyright 2024 Test Company"
          trademarks: "Test Trademark"

      - name: Assert build output exists
        run: |
          echo "Checking for build output..."
          ls -la build/ || true
          if [ ! -d "build" ]; then
            echo "FAIL: output directory build does not exist"
            exit 1
          fi
          echo "PASS: build directory exists"
