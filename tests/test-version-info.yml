name: Test version information inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create dummy script
        run: echo "print('hello')" > hello.py
      - id: action
        uses: .
        continue-on-error: true
        with:
          script-name: hello.py
          mode: accelerated
          company-name: "Test Company"
          product-name: "Test Product"
          file-version: "1.0.0.0"
          product-version: "1.0.0.0"
          file-description: "Test binary"
          copyright: "Copyright 2024 Test"
          trademarks: "Test TM"
          disable-cache: "true"
      - name: Assert action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
