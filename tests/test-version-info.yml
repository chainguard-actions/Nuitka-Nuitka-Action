name: Test version info options inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create test script
        run: |
          cat > /tmp/hello.py << 'EOF'
          print("hello")
          EOF
      - id: action
        uses: .
        continue-on-error: true
        with:
          script-name: /tmp/hello.py
          mode: accelerated
          company-name: "TestCompany"
          product-name: "TestProduct"
          file-version: "1.0.0.0"
          product-version: "1.0.0.0"
          file-description: "Test binary"
          copyright: "Copyright 2024 TestCompany"
          trademarks: "TestTrademark"
          output-dir: /tmp/build-version
          disable-cache: "true"
      - name: Assert action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
