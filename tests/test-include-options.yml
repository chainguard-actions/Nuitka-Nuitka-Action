name: Test Nuitka include and exclude options

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc python3-dev patchelf

      - name: Create Python script and supporting files
        run: |
          mkdir -p mydata
          echo "data content" > mydata/sample.txt
          echo "extra data" > extra.dat

          cat > pkg_config.yml << 'EOF'
          - module-name: "os"
            anti-bloat:
              - description: "test"
                no-auto-follow: true
          EOF

          cat > hello_include.py << 'EOF'
          import os
          print("Hello with include options!")
          EOF

      - name: Build with Nuitka using include/exclude options
        id: build
        uses: .
        with:
          script-name: hello_include.py
          nuitka-version: "2.0"
          standalone: "false"
          onefile: "false"
          module: "false"
          output-dir: build
          disable-cache: "true"
          show-scons: "false"
          assume-yes-for-downloads: "true"
          include-data-dir: "mydata=mydata"
          include-data-files: "extra.dat=extra.dat"
          include-package-data: "os"
          include-package: "os"
          include-module: "os.path"
          include-plugin-directory: "."
          include-plugin-files: "*.py"
          noinclude-data-files: "*.pyc"
          nofollow-import-to: "*.tests"
          prefer-source-code: "false"
          user-package-configuration-file: "pkg_config.yml"

      - name: Assert build output exists
        run: |
          echo "Checking for build output..."
          ls -la build/ || true
          if [ ! -d "build" ]; then
            echo "FAIL: output directory build does not exist"
            exit 1
          fi
          echo "PASS: build directory exists"
