name: Test build with include/exclude options

on:
  workflow_dispatch:

jobs:
  test-include-options:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install system dependencies for Nuitka
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc python3-dev patchelf

      - name: Set up Python
        run: |
          python --version
          pip --version

      - name: Create user package configuration file
        run: |
          cat > /tmp/user-pkg-config.yaml << 'EOF'
          - module-name: "hello"
            anti-bloat:
              - description: "test"
          EOF

      - id: build
        uses: .
        with:
          working-directory: tests/fixtures
          script-name: hello.py
          standalone: "true"
          onefile: "true"
          output-dir: build
          assume-yes-for-downloads: "true"
          disable-cache: "true"
          include-data-dir: "."
          include-data-files: "hello.py=hello.py"
          include-package: "os"
          include-module: "os.path"
          include-package-data: "os"
          include-plugin-directory: "."
          include-plugin-files: "*.py"
          noinclude-data-files: "*.pyc"
          nofollow-import-to: "*.tests"
          prefer-source-code: "true"
          user-package-configuration-file: "/tmp/user-pkg-config.yaml"

      - name: Assert binary was created
        run: |
          echo "Checking for built binary..."
          ls -la tests/fixtures/build/ || true
          FOUND=$(find tests/fixtures/build -maxdepth 1 -type f -executable 2>/dev/null | head -1)
          if [ -z "$FOUND" ]; then
            FOUND=$(find tests/fixtures/build -maxdepth 1 -type f 2>/dev/null | grep -v '\.py$' | head -1)
          fi
          if [ -z "$FOUND" ]; then
            echo "FAIL: No executable found in tests/fixtures/build directory"
            find tests/fixtures/build -type f 2>/dev/null || echo "build directory does not exist"
            exit 1
          fi
          echo "PASS: Binary found: $FOUND"
