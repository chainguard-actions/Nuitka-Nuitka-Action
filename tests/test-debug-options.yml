name: Test debug and tracing options inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create test script
        run: |
          cat > /tmp/hello.py << 'EOF'
          print("hello")
          EOF
      - id: action
        uses: .
        continue-on-error: true
        with:
          script-name: /tmp/hello.py
          mode: accelerated
          debug: ""
          no-debug-immortal-assumptions: ""
          no-debug-c-warnings: ""
          unstripped: ""
          trace-execution: ""
          xml: ""
          experimental: ""
          output-dir: /tmp/build-debug
          disable-cache: "true"
      - name: Assert action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
