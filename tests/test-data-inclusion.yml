name: Test data inclusion inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create dummy script and data
        run: |
          echo "print('hello')" > hello.py
          mkdir -p mydata
          echo "data" > mydata/file.txt
      - id: action
        uses: .
        continue-on-error: true
        with:
          script-name: hello.py
          mode: accelerated
          include-package-data: ""
          include-data-files: ""
          include-data-dir: ""
          noinclude-data-files: ""
          include-onefile-external-data: ""
          include-raw-dir: ""
          include-package: ""
          include-module: ""
          include-plugin-directory: ""
          include-plugin-files: ""
          prefer-source-code: "false"
          nofollow-import-to: ""
          user-package-configuration-file: ""
          disable-cache: "true"
      - name: Assert action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
