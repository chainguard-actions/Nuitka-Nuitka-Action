name: Test Nuitka commercial and access-token inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gcc \
            python3-dev \
            python3-pip \
            python-is-python3 \
            patchelf \
            git
          python --version
          pip --version

      - name: Create simple Python script
        run: |
          cat > hello.py << 'EOF'
          print("Hello from Nuitka!")
          EOF

      - name: Build with Nuitka (commercial plugin inputs, no real token)
        id: build
        continue-on-error: true
        uses: .
        with:
          script-name: hello.py
          nuitka-version: "main"
          mode: accelerated
          disable-cache: "true"
          assume-yes-for-downloads: "true"
          output-dir: build
          # Access token (empty = use public Nuitka, not commercial)
          access-token: ""
          # Anti-debugger plugin (commercial)
          anti-debugger-debugging: "false"
          # Automatic-updates plugin (commercial)
          auto-update-url-spec: ""
          auto-update-debug: "false"
          # Data-hiding plugin (commercial)
          data-hiding-salt-value: ""
          # Datafile-inclusion-ng plugin (commercial)
          embed-data-files-compile-time-pattern: ""
          embed-data-files-run-time-pattern: ""
          embed-data-files-qt-resource-pattern: ""
          embed-debug-qt-resources: "false"
          # Signing plugin (commercial, Windows only)
          windows-signing-tool: ""
          windows-certificate-name: ""
          windows-certificate-sha1: ""
          windows-certificate-filename: ""
          windows-certificate-password: ""
          windows-signed-content-comment: ""
          # Traceback-encryption plugin (commercial)
          encryption-key: ""
          encrypt-stdout: "false"
          encrypt-stderr: "false"
          encrypt-debug-init: "false"
          encrypt-crypto-package: ""
          # Windows-service plugin (commercial)
          windows-service-name: ""
          windows-service-grace-time: ""
          windows-service-start-mode: ""
          windows-service-cli: "false"

      - name: Assert build ran (or failed gracefully)
        run: |
          echo "Build outcome: ${{ steps.build.outcome }}"
          if [ "${{ steps.build.outcome }}" = "success" ]; then
            if find build/ -name "hello*" -type f | grep -q .; then
              echo "PASS: Build output found"
            else
              echo "FAIL: Build succeeded but no output found"
              exit 1
            fi
          elif [ "${{ steps.build.outcome }}" = "failure" ]; then
            echo "PASS: Action ran and failed gracefully (commercial features not available without token)"
          else
            echo "FAIL: Unexpected outcome: ${{ steps.build.outcome }}"
            exit 1
          fi
