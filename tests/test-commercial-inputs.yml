name: Test Nuitka build with commercial plugin inputs (no-op values)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gcc \
            python3-dev \
            python3-pip \
            python-is-python3 \
            patchelf \
            git
          python --version
          pip --version

      - name: Create simple Python script
        run: |
          cat > hello.py << 'EOF'
          print("Hello from Nuitka!")
          EOF

      - name: Build with Nuitka (commercial plugin inputs as empty/no-op)
        id: build
        uses: .
        with:
          script-name: hello.py
          nuitka-version: "main"
          mode: accelerated
          disable-cache: "true"
          assume-yes-for-downloads: "true"
          output-dir: build
          # Commercial access token (empty = use open-source Nuitka)
          access-token: ""
          # Anti-debugger plugin inputs (commercial, no-op without commercial)
          anti-debugger-debugging: ""
          # Auto-update plugin inputs (commercial, no-op without commercial)
          auto-update-url-spec: ""
          auto-update-debug: ""
          # Data-hiding plugin inputs (commercial, no-op without commercial)
          data-hiding-salt-value: ""
          # Datafile-inclusion-ng plugin inputs (commercial, no-op without commercial)
          embed-data-files-compile-time-pattern: ""
          embed-data-files-run-time-pattern: ""
          embed-data-files-qt-resource-pattern: ""
          embed-debug-qt-resources: ""
          # Traceback-encryption plugin inputs (commercial, no-op without commercial)
          encryption-key: ""
          encrypt-stdout: ""
          encrypt-stderr: ""
          encrypt-debug-init: ""
          encrypt-crypto-package: ""

      - name: Assert build output exists
        run: |
          echo "Checking for build output..."
          echo "=== build/ directory contents ==="
          find build/ -type f 2>/dev/null || echo "build/ directory is empty or missing"
          echo "================================="
          if find build/ -name "hello*" -type f | grep -q .; then
            echo "PASS: Build output found"
            find build/ -name "hello*" -type f
          else
            echo "FAIL: Expected build output not found in build/"
            exit 1
          fi
