name: Test Nuitka build with inclusion and plugin inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gcc \
            python3-dev \
            python3-pip \
            python-is-python3 \
            patchelf \
            git
          python --version
          pip --version

      - name: Create simple Python script and data files
        run: |
          cat > hello.py << 'EOF'
          print("Hello from Nuitka!")
          EOF
          mkdir -p mydata
          echo "sample data" > mydata/sample.txt

      - name: Build with Nuitka (inclusion and plugin inputs)
        id: build
        uses: .
        with:
          script-name: hello.py
          nuitka-version: "main"
          mode: accelerated
          disable-cache: "true"
          assume-yes-for-downloads: "true"
          output-dir: build
          # Plugin inputs
          enable-plugins: ""
          user-plugin: ""
          plugin-no-detection: ""
          module-parameter: ""
          # Inclusion inputs
          include-package-data: ""
          include-data-files: ""
          include-data-dir: ""
          noinclude-data-files: ""
          include-onefile-external-data: ""
          include-raw-dir: ""
          include-package: ""
          include-module: ""
          include-plugin-directory: ""
          include-plugin-files: ""
          prefer-source-code: ""
          nofollow-import-to: ""
          user-package-configuration-file: ""
          # Anti-bloat plugin options
          noinclude-setuptools-mode: "warning"
          noinclude-pytest-mode: "warning"
          noinclude-unittest-mode: "warning"
          noinclude-pydoc-mode: "warning"
          noinclude-IPython-mode: "warning"
          noinclude-dask-mode: "warning"
          noinclude-numba-mode: "warning"
          noinclude-default-mode: "warning"
          noinclude-custom-mode: ""
          # Qt plugin options
          include-qt-plugins: ""
          noinclude-qt-plugins: ""
          noinclude-qt-translations: ""
          # Pmw plugin options
          include-pmw-blt: ""
          include-pmw-color: ""
          # Tk/Tcl plugin options
          tk-library-dir: ""
          tcl-library-dir: ""
          # Dill-compat plugin options
          include-pickle-support-module: ""

      - name: Assert build output exists
        run: |
          echo "Checking for build output..."
          echo "=== build/ directory contents ==="
          find build/ -type f 2>/dev/null || echo "build/ directory is empty or missing"
          echo "================================="
          if find build/ -name "hello*" -type f | grep -q .; then
            echo "PASS: Build output found"
            find build/ -name "hello*" -type f
          else
            echo "FAIL: Expected build output not found in build/"
            exit 1
          fi
