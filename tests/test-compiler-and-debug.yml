name: Test Nuitka compiler, debug, and version-info inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gcc \
            python3-dev \
            python3-pip \
            python-is-python3 \
            patchelf \
            git
          python --version
          pip --version

      - name: Create simple Python script
        run: |
          cat > hello.py << 'EOF'
          print("Hello from Nuitka!")
          EOF

      - name: Build with Nuitka (compiler/debug/version-info inputs)
        id: build
        continue-on-error: true
        uses: .
        with:
          script-name: hello.py
          nuitka-version: "main"
          mode: accelerated
          disable-cache: "true"
          assume-yes-for-downloads: "true"
          output-dir: build
          # Compiler controls
          clang: "false"
          mingw64: "false"
          msvc: ""
          jobs: "1"
          lto: "no"
          static-libpython: "auto"
          cf-protection: "auto"
          # Debug features
          debug: "false"
          no-debug-immortal-assumptions: "false"
          no-debug-c-warnings: "false"
          unstripped: "false"
          trace-execution: "false"
          xml: ""
          experimental: ""
          low-memory: "false"
          # Version information
          company-name: "TestCompany"
          product-name: "TestProduct"
          file-version: "1.0.0.0"
          product-version: "1.0.0.0"
          file-description: "Test binary"
          copyright: "Copyright 2024"
          trademarks: "TestMark"
          # Tracing/reporting
          report: ""
          report-diffable: "false"
          report-user-provided: ""
          report-template: ""
          quiet: "false"
          show-scons: "false"
          show-memory: "false"

      - name: Assert build ran (or failed gracefully with unsupported inputs)
        run: |
          echo "Build outcome: ${{ steps.build.outcome }}"
          if [ "${{ steps.build.outcome }}" = "success" ]; then
            if find build/ -name "hello*" -type f | grep -q .; then
              echo "PASS: Build output found"
            else
              echo "FAIL: Build succeeded but no output found"
              exit 1
            fi
          elif [ "${{ steps.build.outcome }}" = "failure" ]; then
            echo "PASS: Action ran and failed gracefully (expected for some input combinations)"
          else
            echo "FAIL: Unexpected outcome: ${{ steps.build.outcome }}"
            exit 1
          fi
