name: Test Nuitka build with compiler, debug, and deployment inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gcc \
            python3-dev \
            python3-pip \
            python-is-python3 \
            patchelf \
            git
          python --version
          pip --version

      - name: Create simple Python script
        run: |
          cat > hello.py << 'EOF'
          print("Hello from Nuitka!")
          EOF

      - name: Build with Nuitka (compiler, debug, deployment inputs)
        id: build
        uses: .
        with:
          script-name: hello.py
          nuitka-version: "main"
          mode: accelerated
          disable-cache: "true"
          assume-yes-for-downloads: "true"
          output-dir: build
          # Compiler inputs
          clang: ""
          mingw64: ""
          msvc: ""
          jobs: "1"
          lto: "auto"
          static-libpython: "auto"
          cf-protection: "auto"
          low-memory: "true"
          # Debug inputs
          debug: ""
          no-debug-immortal-assumptions: ""
          no-debug-c-warnings: ""
          unstripped: ""
          trace-execution: ""
          xml: ""
          experimental: ""
          # Deployment inputs
          deployment: ""
          no-deployment-flag: ""
          # Onefile inputs
          onefile-tempdir-spec: ""
          onefile-child-grace-time: ""
          onefile-no-compression: ""
          onefile-windows-splash-screen-image: ""
          # Console inputs (obsolete but still accepted)
          disable-console: ""
          enable-console: ""
          # OS-level output redirection
          force-stdout-spec: ""
          force-stderr-spec: ""

      - name: Assert build output exists
        run: |
          echo "Checking for build output..."
          echo "=== build/ directory contents ==="
          find build/ -type f 2>/dev/null || echo "build/ directory is empty or missing"
          echo "================================="
          if find build/ -name "hello*" -type f | grep -q .; then
            echo "PASS: Build output found"
            find build/ -name "hello*" -type f
          else
            echo "FAIL: Expected build output not found in build/"
            exit 1
          fi
