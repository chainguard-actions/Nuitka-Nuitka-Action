name: Test compilation flags inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create dummy script
        run: echo "print('hello')" > hello.py
      - id: action
        uses: .
        continue-on-error: true
        with:
          script-name: hello.py
          mode: accelerated
          python-flag: "no_site"
          python-debug: "false"
          clang: "false"
          mingw64: "false"
          msvc: ""
          jobs: "1"
          lto: "auto"
          static-libpython: "auto"
          cf-protection: "auto"
          debug: "false"
          no-debug-immortal-assumptions: "false"
          no-debug-c-warnings: "false"
          unstripped: "false"
          trace-execution: "false"
          low-memory: "true"
          experimental: ""
          xml: ""
          disable-cache: "true"
      - name: Assert action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
