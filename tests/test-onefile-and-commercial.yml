name: Test Nuitka onefile and commercial plugin options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gcc \
            python3-dev \
            python3-pip \
            python-is-python3 \
            patchelf \
            git
          python --version
          pip --version

      - name: Create simple Python script
        run: |
          cat > hello.py << 'EOF'
          print("Hello onefile!")
          EOF

      - name: Build with Nuitka (onefile and commercial options)
        id: build
        uses: .
        with:
          script-name: hello.py
          nuitka-version: "main"
          mode: accelerated
          disable-cache: "true"
          assume-yes-for-downloads: "true"
          output-dir: build
          # Access token (empty = use public Nuitka)
          access-token: ""
          # Onefile options (not used in accelerated mode, but inputs must be covered)
          onefile-tempdir-spec: ""
          onefile-child-grace-time: ""
          onefile-no-compression: ""
          # Commercial plugin options (empty values, not using commercial)
          anti-debugger-debugging: ""
          auto-update-url-spec: ""
          auto-update-debug: ""
          data-hiding-salt-value: ""
          embed-data-files-compile-time-pattern: ""
          embed-data-files-run-time-pattern: ""
          embed-data-files-qt-resource-pattern: ""
          embed-debug-qt-resources: ""
          encryption-key: ""
          encrypt-stdout: ""
          encrypt-stderr: ""
          encrypt-debug-init: ""
          encrypt-crypto-package: ""

      - name: Assert build output exists
        run: |
          echo "Checking for build output..."
          find build/ -type f 2>/dev/null || echo "build/ directory is empty or missing"
          if find build/ -name "hello*" -type f | grep -q .; then
            echo "PASS: Build output found"
          else
            echo "FAIL: Expected build output not found in build/"
            exit 1
          fi
