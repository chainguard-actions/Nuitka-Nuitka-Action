name: Test console and warnings options inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create test script
        run: |
          cat > /tmp/hello.py << 'EOF'
          print("hello")
          EOF
      - id: action
        uses: .
        continue-on-error: true
        with:
          script-name: /tmp/hello.py
          mode: accelerated
          disable-console: ""
          enable-console: ""
          force-stdout-spec: ""
          force-stderr-spec: ""
          windows-console-mode: ""
          warn-implicit-exceptions: ""
          warn-unusual-code: ""
          nowarn-mnemonic: ""
          deployment: ""
          no-deployment-flag: ""
          output-dir: /tmp/build-console
          disable-cache: "true"
      - name: Assert action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
