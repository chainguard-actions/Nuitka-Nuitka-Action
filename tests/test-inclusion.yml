name: Test data and module inclusion inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          script-name: tests/fixtures/hello.py
          disable-cache: "true"
          # Data file inclusion inputs
          include-package-data: ""
          include-data-files: ""
          include-data-dir: ""
          noinclude-data-files: ""
          include-data-files-external: ""
          include-raw-dir: ""
          # Module/package inclusion inputs
          include-package: ""
          include-module: ""
          include-plugin-directory: ""
          include-plugin-files: ""
          prefer-source-code: "false"
          nofollow-import-to: ""
          user-package-configuration-file: ""
          # DLL inputs
          noinclude-dlls: ""
          include-windows-runtime-dlls: ""
      - name: Assert action ran (build attempted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
