name: Test Nuitka build with platform-specific inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gcc \
            python3-dev \
            python3-pip \
            python-is-python3 \
            patchelf \
            git
          python --version
          pip --version

      - name: Create simple Python script
        run: |
          cat > hello.py << 'EOF'
          print("Hello from Nuitka!")
          EOF

      - name: Build with Nuitka (platform-specific inputs)
        id: build
        uses: .
        with:
          script-name: hello.py
          nuitka-version: "main"
          mode: accelerated
          disable-cache: "true"
          assume-yes-for-downloads: "true"
          output-dir: build
          # Windows-specific inputs (no-op on Linux)
          windows-console-mode: ""
          windows-icon-from-ico: ""
          windows-icon-from-exe: ""
          windows-uac-admin: ""
          windows-uac-uiaccess: ""
          # Windows signing inputs (no-op on Linux)
          windows-signing-tool: ""
          windows-certificate-name: ""
          windows-certificate-sha1: ""
          windows-certificate-filename: ""
          windows-certificate-password: ""
          windows-signed-content-comment: ""
          # Windows service inputs (no-op on Linux)
          windows-service-name: ""
          windows-service-grace-time: ""
          windows-service-start-mode: ""
          windows-service-cli: ""
          # macOS-specific inputs (no-op on Linux)
          macos-target-arch: ""
          macos-app-icon: ""
          macos-signed-app-name: ""
          macos-app-name: ""
          macos-app-mode: ""
          macos-sign-identity: ""
          macos-sign-notarization: ""
          macos-app-version: ""
          macos-app-protected-resource: ""
          # Linux-specific inputs
          linux-icon: ""
          # UPX plugin inputs
          upx-binary: ""
          upx-disable-cache: ""

      - name: Assert build output exists
        run: |
          echo "Checking for build output..."
          echo "=== build/ directory contents ==="
          find build/ -type f 2>/dev/null || echo "build/ directory is empty or missing"
          echo "================================="
          if find build/ -name "hello*" -type f | grep -q .; then
            echo "PASS: Build output found"
            find build/ -name "hello*" -type f
          else
            echo "FAIL: Expected build output not found in build/"
            exit 1
          fi
